name: Deploy ZapDash to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci
      - name: Fail if the tracked snapshot is stale
        # The build falls back to the committed snapshot (CI has no data/ DB), so a
        # green deploy can ship old data. Compare collected_through against the
        # COMMIT date, not the runtime clock, so re-running an old workflow still
        # measures the commit's own freshness rather than today's.
        env:
          COMMIT_TS: ${{ github.event.head_commit.timestamp || github.run_started_at }}
        run: python3 scripts/check-snapshot-freshness.py --as-of "$COMMIT_TS" --max-days 10
      - name: Build static export from the tracked privacy-safe snapshot
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: /nyc-zap-dash
        run: |
          npm run data:export
          npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4